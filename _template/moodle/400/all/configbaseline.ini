[core]
; Authentication
authloginviaemail=1
forcelogin=1
forceloginforprofiles=1
forceloginforprofileimage=1
guestloginbutton=0
loginpageautofocus=1

; Additional modules
allowstealth=1
completiondefault=0
enableanalytics=0
enableblogs=0
enablenotes=0
usecomments=0
usetags=0

; Privacy and security
allowindexing=2
hiddenuserfields='description,email,city,country,moodlenetprofile,timezone,webpage,icqnumber,skypeid,yahooid,aimid,msnid,firstaccess,lastaccess,lastip,mycourses,groups,suspended'

; Policies
sitepolicyhandler='tool_policy'

; Localization
forcetimezone='Europe/Berlin'
timezone='Europe/Berlin'

; Phone home to Moodle HQ
enableuserfeedback=0

; Default user preferences
defaultpreference_maildisplay=0

; Enrolments
; Note: The enrol_plugins_enabled config is not exposed in the site administration GUI
enrol_plugins_enabled='manual,self,cohort'

[atto_morebackcolors]
atto_morebackcolors/availablecolors='
#3366FF #6633FF #CC33FF #FF33CC
#33CCFF #003DF5 #002EB8 #FF3366
#33FFCC #B88A00 #F5B800 #FF6633
#33FF66 #66FF33 #CCFF33 #FFCC33'

[atto_morefontcolors]
atto_morefontcolors/availablecolors='
#3366FF #6633FF #CC33FF #FF33CC
#33CCFF #003DF5 #002EB8 #FF3366
#33FFCC #B88A00 #F5B800 #FF6633
#33FF66 #66FF33 #CCFF33 #FFCC33'

[editor_atto]
editor_atto/toolbar='
collapse = collapse, fullscreen
style1 = title
style2 = bold, italic
color = morefontcolors, morebackcolors
links = link
list = unorderedlist, orderedlist
undo = undo
align = align
indent = indent
files = image, media, recordrtc, managefiles, h5p
style3 = strike, subscript, superscript
insert = emojipicker, equation, charmap, table, hr
clear = clear
preview = preview
html = html
invisible = filedragdrop'
atto_collapse/showgroups=7

[format_tiles]
format_tiles/assumedatastoreconsent=1
format_tiles/phototilesaltstyle=1
format_tiles/phototiletitletransarency='0.2'
format_tiles/phototitletitlelineheight=306

[local_envbar]
local_envbar/stringseparator='–'
local_envbar/showconfiglink=0
local_envbar/showdebugging=0
local_envbar/enablemenu=0
local_envbar/highlightlinks=1
local_envbar/highlightlinksenvbar=0
local_envbar/enablefaviconcolorize=1
local_envbar/enabletitleprefix=1
local_envbar/enableemailprefix=1

[mod_bigbluebuttonbn]
bigbluebuttonbn_welcome_editable=1
bigbluebuttonbn_recording_default=0
bigbluebuttonbn_recordings_preview_editable=300
bigbluebuttonbn_recording_editable=1
bigbluebuttonbn_recording_all_from_start_default=0
bigbluebuttonbn_recording_all_from_start_editable=1
bigbluebuttonbn_recording_hide_button_default=0
bigbluebuttonbn_recording_hide_button_editable=1
bigbluebuttonbn_importrecordings_enabled=1
bigbluebuttonbn_importrecordings_from_deleted_enabled=1
bigbluebuttonbn_recordings_deleted_default=1
bigbluebuttonbn_recordings_deleted_editable=1
bigbluebuttonbn_recordings_imported_editable=1
bigbluebuttonbn_recordings_preview_default=1
bigbluebuttonbn_recordings_preview_editable=1
bigbluebuttonbn_recordings_sortorder=0
bigbluebuttonbn_recording_protect_editable=1
bigbluebuttonbn_waitformoderator_default=1
bigbluebuttonbn_waitformoderator_editable=1
bigbluebuttonbn_waitformoderator_ping_interval=10
bigbluebuttonbn_waitformoderator_cache_ttl=60
bigbluebuttonbn_voicebridge_editable=0
bigbluebuttonbn_preuploadpresentation_editable=1
bigbluebuttonbn_userlimit_default=0
bigbluebuttonbn_userlimit_editable=1
bigbluebuttonbn_participant_moderator_default=3
bigbluebuttonbn_muteonstart_default=1
bigbluebuttonbn_muteonstart_editable=1
bigbluebuttonbn_disablecam_default=0
bigbluebuttonbn_disablecam_editable=1
bigbluebuttonbn_disablemic_default=0
bigbluebuttonbn_disablemic_editable=1
bigbluebuttonbn_disableprivatechat_default=0
bigbluebuttonbn_disableprivatechat_editable=1
bigbluebuttonbn_disablepublicchat_default=0
bigbluebuttonbn_disablepublicchat_editable=1
bigbluebuttonbn_disablenote_default=0
bigbluebuttonbn_disablenote_editable=1
bigbluebuttonbn_hideuserlist_default=0
bigbluebuttonbn_hideuserlist_editable=1
bigbluebuttonbn_lockonjoin_default=1
bigbluebuttonbn_lockonjoin_editable=0
bigbluebuttonbn_meetingevents_enabled=1

[mod_scorm]
scorm/displayattemptstatus=0
scorm/forcenewattempt=1
scorm/hidebrowse=1
scorm/hidetoc=3
scorm/nav=0
scorm/skipview=2

[theme_boost_union]
theme=boost_union
theme_boost_union/coursecontentmaxwidth='950px'
theme_boost_union/backtotopbutton='yes'
theme_boost_union/showswitchedroleincourse='yes'
theme_boost_union/showhintcoursehidden='yes'
theme_boost_union/showhintcourseguestaccess='yes'

[tool_dataprivacy]
tool_dataprivacy/showdataretentionsummary=0
