[core]
; Authentication
authloginviaemail=1
forcelogin=1
forceloginforprofiles=1
forceloginforprofileimage=1
guestloginbutton=0
loginpageautofocus=1

; Additional modules
enableoutcomes=0
usecomments=0
usetags=0
enablenotes=0
enableportfolios=0
enablewebservices=1
enablestats=0
enablerssfeeds=0
enableblogs=0
mnet_dispatcher_mode='off'
enablecompletion=1
completiondefault=0
enableavailability=1
enableplagiarism=0
enablebadges=0
enableglobalsearch=0
allowstealth=1
enableanalytics=0
messaging=1
enablecustomreports=1
allowemojipicker=1
enablemobilewebservice=0
enableaccessibilitytools=0

; Privacy and security
allowindexing=2
hiddenuserfields='description,email,city,country,moodlenetprofile,timezone,webpage,icqnumber,skypeid,yahooid,aimid,msnid,firstaccess,lastaccess,lastip,mycourses,groups,suspended'

; Policies
sitepolicyhandler='tool_policy'

; Localization
forcetimezone='Europe/Berlin'
timezone='Europe/Berlin'

; Default user preferences
defaultpreference_maildisplay=0

; Enrolments
; Note: The enrol_plugins_enabled config is not exposed in the site administration GUI
