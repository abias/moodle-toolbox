[core]
; Authentication
authloginviaemail=1
forcelogin=1
forceloginforprofileimage=1
guestloginbutton=0
loginpageautofocus=1

; Additional modules
allowstealth=1
completiondefault=0
enableanalytics=0
enableblogs=0
enablebadges=0
enablenotes=0
usecomments=0
usetags=0

; Privacy and security
allowindexing=2
hiddenuserfields="description,email,city,country,timezone,webpage,icqnumber,skypeid,yahooid,aimid,msnid,firstaccess,lastaccess,mycourses,groups,suspended"

; Policies
sitepolicyhandler="tool_policy"

; Localization
forcetimezone="Europe/Berlin"
timezone="Europe/Berlin"

; Phone home to Moodle HQ
enableuserfeedback='0'

; Default user preferences
defaultpreference_maildisplay=0

; Enrolments
enrol_plugins_enabled="manual,self,cohort"

[atto_morefontcolors]
atto_morefontcolors/availablecolors='#3366FF #6633FF #CC33FF #FF33CC #33CCFF #003DF5 #002EB8 #FF3366 #33FFCC #B88A00 #F5B800 #FF6633 #33FF66 #66FF33 #CCFF33 #FFCC33'

[editor_atto]
editor_atto/toolbar="
collapse = collapse, fullscreen
style1 = title, bold, italic
list = unorderedlist, orderedlist
links = link
files = image, media, recordrtc, managefiles
style2 = underline, strike, subscript, superscript
align = align
indent = indent
insert = equation, charmap, table, clear
undo = undo
format = morefontcolors, styles
other = htmlplus"

[format_tiles]
format_tiles/assumedatastoreconsent='1'
format_tiles/phototilesaltstyle='1'
format_tiles/phototiletitletransarency='0.2'
format_tiles/phototitletitlelineheight='306'

[local_boostnavigation]
local_boostnavigation/collapsecoursesectionscoursenode='1'
local_boostnavigation/collapsecoursesectionscoursenodedefault='1'
local_boostnavigation/collapsecoursesectionscoursenodesession='1'
local_boostnavigation/collapsecustombottomnodesadmins='1'
local_boostnavigation/collapsecustombottomnodesadminsaccordion='1'
local_boostnavigation/collapsemycoursesnode='1'
local_boostnavigation/collapsemycoursesnodedefault='1'
local_boostnavigation/collapsemycoursesnodesession='1'
local_boostnavigation/insertcustombottomnodesadmins="Administration|/admin/index.php
Nutzerliste|/admin/user.php
Kursverwaltung|/course/management.php
Projekt-Support|/course/view.php?id=2"
local_boostnavigation/insertcoursesectionscoursenode='1'
local_boostnavigation/removebadgescoursenode='1'
local_boostnavigation/removecalendarnode='1'
local_boostnavigation/removecompetenciescoursenode='1'
local_boostnavigation/removegradescoursenode='1'
local_boostnavigation/removehomenode='1'
local_boostnavigation/removeparticipantscoursenode=1
local_boostnavigation/removeprivatefilesnode='1'

[mod_bigbluebuttonbn]
bigbluebuttonbn_importrecordings_enabled=1
bigbluebuttonbn_importrecordings_from_deleted_enabled=1
bigbluebuttonbn_meetingevents_enabled=1
bigbluebuttonbn_muteonstart_default=1
bigbluebuttonbn_muteonstart_editable=1
bigbluebuttonbn_participant_moderator_default=3
bigbluebuttonbn_preuploadpresentation_enabled=1
bigbluebuttonbn_recording_all_from_start_editable=1
bigbluebuttonbn_recording_hide_button_editable=1
bigbluebuttonbn_recordingready_enabled=1
bigbluebuttonbn_recordings_deleted_editable=1
bigbluebuttonbn_recordings_html_editable=1
bigbluebuttonbn_recordings_imported_default=0
bigbluebuttonbn_recordings_preview_editable=1
bigbluebuttonbn_userlimit_editable=1
bigbluebuttonbn_waitformoderator_default=1

[mod_scorm]
scorm/displayattemptstatus='0'
scorm/forcenewattempt='1'
scorm/hidebrowse='1'
scorm/hidetoc='3'

[tool_dataprivacy]
tool_dataprivacy/showdataretentionsummary='0'
